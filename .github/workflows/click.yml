name: Click package

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  click:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        # the OpenStore takes one click per architecture
        arch: [arm64, armhf, amd64]
    env:
      # the runner has podman too, which fails to map the container user ids
      CLICKABLE_DOCKER_COMMAND: docker
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Install Clickable
        run: pipx install clickable-ut

      - name: Prepare dependencies
        run: clickable script prepare-deps -c packaging/click/slim-build.yaml

      - name: Build libraries (${{ matrix.arch }})
        run: clickable build --libs --arch ${{ matrix.arch }} -c packaging/click/slim-build.yaml

      - name: Build click (${{ matrix.arch }})
        run: clickable build --arch ${{ matrix.arch }} -c packaging/click/slim-build.yaml

      - name: Upload click
        uses: actions/upload-artifact@v4
        with:
          name: padyab-maps-click-${{ matrix.arch }}
          path: build/*/app/*.click

      - name: Attach click to the release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${GITHUB_REF_NAME}" build/*/app/*.click --clobber
