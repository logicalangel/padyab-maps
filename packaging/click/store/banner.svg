<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f3f6ef"/>
      <stop offset="1" stop-color="#e2eadb"/>
    </linearGradient>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f3f6ef" stop-opacity="1"/>
      <stop offset="0.40" stop-color="#f3f6ef" stop-opacity="0.94"/>
      <stop offset="0.55" stop-color="#f3f6ef" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="pin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff5f56"/>
      <stop offset="1" stop-color="#dc2f2a"/>
    </linearGradient>
    <linearGradient id="water" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#b9def5"/>
      <stop offset="1" stop-color="#9ccdef"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="14"/>
      <feOffset dy="8"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.18"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- map -->
  <rect width="1920" height="1080" fill="url(#bg)"/>
  <path d="M1120 1080c60-120 190-170 330-160s260-60 330-170 140-140 140-140V1080z" fill="url(#water)"/>
  <ellipse cx="1560" cy="250" rx="170" ry="120" fill="#cfe5c4"/>
  <ellipse cx="1010" cy="760" rx="120" ry="80" fill="#cfe5c4"/>
  <g stroke="#ffffff" stroke-linecap="round" fill="none">
    <path d="M760 600L1920 380" stroke-width="44"/>
    <path d="M900 -20L1080 1100" stroke-width="30"/>
    <path d="M1300 -20L1390 1100" stroke-width="26"/>
    <path d="M760 880L1920 830" stroke-width="24"/>
    <path d="M1650 -20L1610 1100" stroke-width="22"/>
  </g>

  <!-- routes: an alternative in light blue, the chosen one in blue -->
  <path d="M1120 900C1190 770 1240 710 1300 650S1440 470 1560 420" fill="none" stroke="#8fc1fb" stroke-width="30" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M1120 900C1120 770 1170 650 1280 610S1480 560 1560 420" fill="none" stroke="#1863d0" stroke-width="40" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M1120 900C1120 770 1170 650 1280 610S1480 560 1560 420" fill="none" stroke="#1f7ef7" stroke-width="28" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- position -->
  <circle cx="1120" cy="900" r="34" fill="#ffffff" filter="url(#shadow)"/>
  <circle cx="1120" cy="900" r="22" fill="#1f7ef7"/>

  <!-- destination pin -->
  <ellipse cx="1560" cy="418" rx="44" ry="13" fill="#000000" opacity="0.18"/>
  <path d="M1560 416C1560 416 1490 344 1490 282a70 70 0 0 1 140 0c0 62-70 134-70 134z"
        fill="url(#pin)" stroke="#ffffff" stroke-width="10" stroke-linejoin="round"/>
  <circle cx="1560" cy="281" r="27" fill="#ffffff"/>

  <!-- floating route card -->
  <g filter="url(#shadow)">
    <rect x="1250" y="720" width="520" height="150" rx="34" fill="#ffffff"/>
  </g>
  <text x="1290" y="793" font-family="Ubuntu, 'Noto Sans', 'Helvetica Neue', Arial, sans-serif" font-size="54" font-weight="700" fill="#1c1c1e">32 min</text>
  <text x="1290" y="840" font-family="Ubuntu, 'Noto Sans', 'Helvetica Neue', Arial, sans-serif" font-size="28" fill="#6e6e73">24 km · arrival 15:42</text>
  <rect x="1612" y="752" width="122" height="86" rx="24" fill="#2fb24c"/>
  <text x="1673" y="808" text-anchor="middle" font-family="Ubuntu, 'Noto Sans', 'Helvetica Neue', Arial, sans-serif" font-size="36" font-weight="700" fill="#ffffff">GO</text>

  <!-- title side -->
  <rect width="1920" height="1080" fill="url(#fade)"/>
  <g transform="translate(150 330)">
    <rect width="150" height="150" rx="34" fill="url(#bg)" stroke="#d5ddcf" stroke-width="2"/>
    <path d="M75 128C75 128 41 93 41 63a34 34 0 0 1 68 0c0 30-34 65-34 65z" fill="url(#pin)" stroke="#ffffff" stroke-width="5" stroke-linejoin="round"/>
    <circle cx="75" cy="62" r="13" fill="#ffffff"/>
  </g>
  <text x="150" y="600" font-family="Ubuntu, 'Noto Sans', 'Helvetica Neue', Arial, sans-serif" font-size="120" font-weight="700" fill="#1c1c1e">Padyab Maps</text>
  <text x="152" y="680" font-family="Ubuntu, 'Noto Sans', 'Helvetica Neue', Arial, sans-serif" font-size="44" fill="#4a4a4f">Maps, search and turn-by-turn navigation</text>
</svg>
