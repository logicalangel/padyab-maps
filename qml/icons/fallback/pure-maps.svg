<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#eef6ee"/>
      <stop offset="1" stop-color="#d4e8d6"/>
    </linearGradient>
    <linearGradient id="water" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#9fd3f5"/>
      <stop offset="1" stop-color="#6fbaf0"/>
    </linearGradient>
    <linearGradient id="pin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff5a52"/>
      <stop offset="1" stop-color="#d9302b"/>
    </linearGradient>
    <clipPath id="tile">
      <rect width="512" height="512" rx="114"/>
    </clipPath>
  </defs>
  <g clip-path="url(#tile)">
    <rect width="512" height="512" fill="url(#bg)"/>
    <!-- water and a park -->
    <path d="M0 360c70-30 120-20 170 10s90 60 160 40 120-60 182-60V512H0z" fill="url(#water)"/>
    <path d="M330 60c50-10 110 10 140 50 25 34 10 80-30 90-45 12-95-10-120-45-22-31-27-87 10-95z" fill="#b7dcae"/>
    <!-- streets -->
    <g stroke="#ffffff" stroke-linecap="round" fill="none">
      <path d="M-20 170L540 110" stroke-width="26"/>
      <path d="M150 -20L230 540" stroke-width="22"/>
      <path d="M380 -20L330 300" stroke-width="18"/>
    </g>
    <!-- route -->
    <path d="M118 410C150 330 190 300 250 290s110-40 120-120" fill="none" stroke="#1f6fe0" stroke-width="34" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M118 410C150 330 190 300 250 290s110-40 120-120" fill="none" stroke="#3d93ff" stroke-width="22" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- start -->
    <circle cx="118" cy="410" r="30" fill="#ffffff"/>
    <circle cx="118" cy="410" r="19" fill="#1f7ef7"/>
    <!-- destination pin -->
    <ellipse cx="370" cy="178" rx="26" ry="9" fill="#000000" opacity="0.18"/>
    <path d="M370 176s-62-62-62-110a62 62 0 0 1 124 0c0 48-62 110-62 110z" fill="url(#pin)" stroke="#ffffff" stroke-width="10" stroke-linejoin="round"/>
    <circle cx="370" cy="66" r="22" fill="#ffffff"/>
  </g>
</svg>
